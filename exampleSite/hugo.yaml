baseURL: https://www.gioelezoccoli.org

locale: it-it
title: "Gioele Maria Zoccoli"

# Use Hugo modules to add theme
module:
  imports:
    - path: github.com/hugo-toha/toha/v4
  mounts:
    - source: static/files
      target: static/files
    - source: ./node_modules/flag-icons/flags
      target: static/flags
    - source: ./node_modules/@fontsource/mulish/files
      target: static/files
    - source: ./node_modules/katex/dist/fonts
      target: static/fonts

# Lingue del sito
languages:
  it:
    locale: it
    label: Italiano
    title: "Gioele Maria Zoccoli"
    weight: 1
  en:
    locale: en
    label: English
    title: "Gioele Maria Zoccoli"
    weight: 2

# lingua predefinita
defaultContentLanguage: it

# Allow raw html in markdown file
markup:
  goldmark:
    renderer:
      unsafe: true
  tableOfContents:
    startLevel: 2
    endLevel: 6
    ordered: false

outputs:
  home:
    - HTML
    - RSS
    - JSON

outputFormats:
  rss:
    baseName: rss

enableEmoji: true

sitemap:
  changefreq: monthly
  priority: 0.5
  filename: sitemap.xml
  disable: false

params:
  # Immagine di sfondo della landing page
  background: /images/site/background.jpg

  logo:
    main: /images/site/main-logo.png
    inverted: /images/site/inverted-logo.png
    favicon: /images/site/favicon.png

  # Repo GitHub del sito
  gitRepo: https://github.com/Jio-Jio99/porfolio
  gitBranch: main

  topNavbar:
    maxVisibleSections: 8

  features:
    theme:
      enable: true
      services:
        light: true
        dark: true
        default: system

    portfolio:
      enable: true

    # Blog disattivato: abilitalo e crea content/posts quando vorrai scrivere articoli
    blog:
      enable: false
      showAuthor: true
      shareButtons:
        linkedin: true
        whatsapp: true
        email: true

    notes:
      enable: false

    comment:
      enable: false

    analytics:
      enable: false

    support:
      enable: false

    toc:
      enable: true

    tags:
      enable: true
      on_card: true

    flags:
      enable: true
      flagOverwrites:
        - locale: en
          countryCode: gb

    embedpdf:
      enable: false

    flowchart:
      enable: false

    math:
      enable: false

    syntaxHighlight:
      enable: true
      services:
        hljs:
          noHighlightRe: /^no-highlight$/i

    videoPlayer:
      enable: false

    copyCodeButton:
      enable: true

    pagination:
      maxPostsPerPage: 12

  footer:
    enable: true
    template: footer.html
    navigation:
      enable: true
      customMenus: false
    contactMe:
      enable: true
    credentials:
      enable: true
    newsletter:
      enable: false
    disclaimer:
      enable: false
