designation: Sviluppatore Full-Stack Freelance

summary: |
  Sono uno sviluppatore software e sto completando la Laurea Magistrale in Computer Science presso la Sapienza di Roma. Mi occupo di progettare soluzioni digitali per il terzo settore, con la convinzione che la tecnologia possa rendere più efficace il lavoro di chi opera nel sociale. In questo percorso, [**SIAMO Cooperativa Sociale**](https://siamoumani.org/) è stata un importante punto di riferimento.

  Con [**La Nuova Arca**](https://www.lanuovaarca.org/chi-siamo/) ho avviato una collaborazione realizzando, insieme a **Mam&Co**, **Empowerment delle Donne**, un CRM dedicato alla gestione e all'accompagnamento dei percorsi di autonomia femminile. Oggi curo anche lo sviluppo di **Mete 2**, la piattaforma per il monitoraggio del progetto di inclusione urbana di Roma Capitale, seguendone l'intera architettura, dal database all'interfaccia.

  Parallelamente, mi occupo di ricerca e sviluppo di soluzioni basate sull'intelligenza artificiale applicate al terzo settore. Con [**Kairos**](https://www.kairoscoopsociale.it/) collaboro ad **AISA**, un progetto di ricerca che esplora come l'AI possa semplificare le attività amministrative e ridurre il carico burocratico degli operatori. Per **La Nuova Arca** seguo invece **AIRONI**, curandone la progettazione e lo sviluppo tecnico, con l'obiettivo di realizzare applicazioni dell'intelligenza artificiale concrete, efficienti e capaci di rispondere a reali esigenze sociali.

