summary: 'Laureato in Informatica all''Università "La Sapienza" di Roma, dove sto completando la Laurea Magistrale in Computer Science. Sviluppo applicazioni web full-stack (frontend in [Vue.js](https://vuejs.org/), backend in [Go](https://go.dev/) con Gin e GORM, database [PostgreSQL](https://www.postgresql.org/)) per associazioni ed enti del terzo settore: gestionali interni, CRM e piattaforme di monitoraggio. In passato ho lavorato anche come formatore informatico, insegnando le basi del computer, il pacchetto Office e la programmazione a studenti e adulti.'

