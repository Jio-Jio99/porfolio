  positions:
  - designation: Full-Stack Developer (freelance)
    start: Mar 2025
    responsibilities:
    - Analisi, sviluppo e manutenzione di applicazioni web per la gestione interna e la promozione dei servizi delle associazioni.
    - Frontend in Vue.js, backend in Go con Gin e GORM, database PostgreSQL.
    - Realizzazione di gestionali/CRM (Empowerment delle Donne con la Nuova Arca, Mete 2) e del portale [Ancona Solidale](https://anconasolidale.org/).
    - Deploy con Docker Compose e Caddy, autenticazione JWT, documentazione API con Swagger.

