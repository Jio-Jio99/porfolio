summary: 'I hold a Bachelor''s degree in Computer Science from "La Sapienza" University of Rome, where I am now completing my Master''s degree in Computer Science. I build full-stack web applications ([Vue.js](https://vuejs.org/) on the frontend, [Go](https://go.dev/) with Gin and GORM on the backend, [PostgreSQL](https://www.postgresql.org/) as database) for non-profit organisations: internal management tools, CRMs and monitoring platforms. I have also worked as an IT trainer in the past, teaching computer basics, the Office suite and programming to students and adults.'

