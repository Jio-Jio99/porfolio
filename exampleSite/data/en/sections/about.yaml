designation: Freelance Full-Stack Developer

summary: |
  I am a software developer completing my Master's degree in Computer Science at Sapienza University of Rome. I design digital solutions for the non-profit sector, convinced that technology can make the work of people in social services more effective. Along the way, [**SIAMO Cooperativa Sociale**](https://siamoumani.org/) has been an important point of reference.

  With [**La Nuova Arca**](https://www.lanuovaarca.org/chi-siamo/) I started a collaboration by building, together with **Mam&Co**, **Empowerment delle Donne**, a CRM for managing and supporting women's pathways to autonomy. Today I also lead the development of **Mete 2**, the platform monitoring Rome's urban inclusion project, overseeing its entire architecture, from the database to the interface.

  Alongside this, I work on research and development of AI-based solutions for the non-profit sector. With [**Kairos**](https://www.kairoscoopsociale.it/) I contribute to **AISA**, a research project exploring how AI can simplify administrative tasks and reduce the bureaucratic burden on social workers. For **La Nuova Arca** I follow **AIRONI**, handling both its design and technical development, with the aim of building AI applications that are concrete, efficient and able to meet real social needs.

